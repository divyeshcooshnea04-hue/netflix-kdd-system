services:
  api-service:
    build:
      context: ./api-service
    container_name: netflix-api
    env_file: .env
    expose:
      - "8001"
    ports:
      - "8001:8001"
    networks:
      - netflix-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  analysis-service:
    build:
      context: ./analysis-service
    container_name: netflix-analysis
    env_file: .env
    expose:
      - "8002"
    ports:
      - "8002:8002"
    networks:
      - netflix-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./dashboard
    container_name: netflix-dashboard
    environment:
      - GATEWAY_URL=http://nginx
    ports:
      - "8501:8501"
    depends_on:
      - nginx
    networks:
      - netflix-net

  nginx:
    image: nginx:1.27-alpine
    container_name: netflix-gateway
    depends_on:
      - api-service
      - analysis-service
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - netflix-net

networks:
  netflix-net:
    driver: bridge