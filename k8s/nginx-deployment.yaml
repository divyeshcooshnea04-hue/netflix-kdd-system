apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: netflix-kdd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: netflix-kdd
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      upstream api_service      { server api-service:8001; }
      upstream analysis_service { server analysis-service:8002; }
      server {
        listen 80;
        location /api/      { proxy_pass http://api_service; }
        location /analysis/ { proxy_pass http://analysis_service; }
        location / { return 200 "Netflix KDD gateway (k8s)\n"; }
      }
    }
